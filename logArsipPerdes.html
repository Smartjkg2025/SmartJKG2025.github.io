<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ADM Desa Jangkang</title>
    <link rel="icon" href="https://portal.beltim.go.id/wp-content/uploads/2021/04/logoBeltim.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" referrerpolicy="no-referrer">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg1:#0a0f1e; --bg2:#111c36; --text:#f1f5f9; --muted:#94a3b8;
            --glass:rgba(255,255,255,.06); --glass-strong:rgba(255,255,255,.10);
            --border:rgba(255,255,255,.12); --input:rgba(255,255,255,.07);
            --blue:#3b82f6; --green:#34d399; --red:#f87171;
        }
        body { font-family:'Plus Jakarta Sans',system-ui,sans-serif; color:var(--text); min-height:100vh;
               background:linear-gradient(150deg,var(--bg1),var(--bg2)); }
        ::selection { background:rgba(59,130,246,.35); }

        /* ---- LOGIN ---- */
        .login-screen { min-height:100vh; display:grid; place-items:center; padding:20px; }
        .login-card { width:100%; max-width:400px; background:var(--glass); border:1px solid var(--border);
                      border-radius:22px; padding:34px 30px; backdrop-filter:blur(16px);
                      box-shadow:0 25px 60px rgba(1,4,15,.5); text-align:center; animation:fadeUp .45s ease; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
        .login-card img { width:64px; height:64px; border-radius:16px; background:#fff; padding:5px;
                          object-fit:contain; margin-bottom:14px; }
        .login-card h1 { font-size:1.3rem; font-weight:800; }
        .login-card > p.sub { color:var(--muted); font-size:.85rem; margin:6px 0 22px; }

        .field { width:100%; padding:13px 16px; margin-bottom:12px; border-radius:12px; border:1px solid var(--border);
                 background:var(--input); color:var(--text); font-family:inherit; font-size:.92rem; outline:none; transition:.25s; }
        .field:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(59,130,246,.2); }
        .pw-wrap { position:relative; }
        .pw-wrap button { position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:transparent;
                          color:var(--muted); cursor:pointer; padding:8px; }

        .login-error { background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.35); color:#fca5a5;
                       font-size:.8rem; padding:10px 14px; border-radius:10px; margin-bottom:12px; text-align:left; }
        .login-ok { background:rgba(52,211,153,.12); border:1px solid rgba(52,211,153,.35); color:#6ee7b7;
                    font-size:.8rem; padding:10px 14px; border-radius:10px; margin-bottom:12px; text-align:left; }

        .btn { display:inline-flex; align-items:center; gap:8px; padding:12px 20px; border-radius:12px; border:0;
               font-family:inherit; font-weight:700; font-size:.9rem; cursor:pointer; transition:.25s; text-decoration:none; }
        .btn-primary { background:linear-gradient(135deg,#2563eb,#60a5fa); color:#fff; width:100%; justify-content:center;
                       box-shadow:0 8px 20px rgba(37,99,235,.4); }
        .btn-primary:hover:not(:disabled) { transform:translateY(-2px); }
        .btn-green { background:linear-gradient(135deg,#059669,#34d399); color:#fff; width:100%; justify-content:center;
                     box-shadow:0 8px 20px rgba(5,150,105,.4); }
        .btn:disabled { opacity:.65; cursor:not-allowed; }

        .forgot { color:var(--muted); font-size:.78rem; text-decoration:none; display:inline-block; margin-top:14px; }
        .forgot:hover { color:#93c5fd; }
        .hint { color:var(--muted); font-size:.72rem; margin-top:16px; line-height:1.5; }
        .back-link { color:var(--muted); font-size:.8rem; text-decoration:none; display:inline-block; margin-top:10px; }
        .back-link:hover { color:var(--text); }
        .copyright { color:rgba(148,163,184,.55); font-size:.68rem; margin-top:18px; }
    </style>
</head>
<body>

    <div class="login-screen" id="loginView">
        <div class="login-card">
            <img src="logo.png" alt="Logo"
                 onerror="this.onerror=null;this.src='https://portal.beltim.go.id/wp-content/uploads/2021/04/logoBeltim.png';">
            <h1>Login Admin</h1>
            <p class="sub">Gerbang akses data &amp; arsip Desa Jangkang</p>

            <form id="loginForm">
                <input type="email" id="loginEmail" class="field" placeholder="Email admin" required autocomplete="username">
                <div class="pw-wrap">
                    <input type="password" id="loginPass" class="field" placeholder="Password" required
                           autocomplete="current-password" style="padding-right:44px;">
                    <button type="button" id="pwToggle" aria-label="Lihat password"><i class="far fa-eye"></i></button>
                </div>
                <div id="loginMsg" class="login-error" hidden></div>
                <button type="submit" class="btn btn-primary" id="loginBtn"><i class="fas fa-right-to-bracket"></i> Masuk</button>
            </form>

            <a href="#" class="forgot" id="forgotLink">Lupa password?</a>
                       <a class="back-link" href="index.html"><i class="fas fa-arrow-left"></i> Kembali ke situs</a>
            <p class="copyright">&copy;2024 Desa_Jangkang</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script>
        /* ================================================
           firebaseConfig — Project: lawangdjangkang
           (sama dengan admin.html & index.html)
           ================================================ */
        const firebaseConfig = {
            apiKey: "AIzaSyAXKugjgU3-ugY-Vy4ubPsWfElKSNLK19w",
            authDomain: "lawangdjangkang.firebaseapp.com",
            projectId: "lawangdjangkang",
            storageBucket: "lawangdjangkang.firebasestorage.app",
            messagingSenderId: "880336737711",
            appId: "1:880336737711:web:3c55aa2eecb8b316744b5a",
            measurementId: "G-V3RXJR2JJN"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        /* ====== KONFIGURASI LOGIN ====== */
        // Hanya email di daftar ini yang boleh masuk
        // (harus sama dengan user di Firebase Console → Authentication → Users)
        const ALLOWED_ADMIN_EMAILS = ["smartdesjangkang@gmail.com"];
        // Halaman tujuan setelah login sukses
        const REDIRECT_URL = "https://drive.google.com/drive/folders/17UAQYPbc1yOilGXfsQiX6k_GoL7GNw4u";
        // true  = tetap login walau browser ditutup
        // false = sesi berakhir saat tab ditutup
        const REMEMBER = true;
        // true = jika masih dalam sesi login, langsung alihkan tanpa menampilkan form.
        // Untuk logout, buka: login.html?logout
        const AUTO_REDIRECT = true;

        const $ = id => document.getElementById(id);
        const emailEl = $('loginEmail'), passEl = $('loginPass'),
              btn = $('loginBtn'), msgBox = $('loginMsg');

        function showMsg(text, type = 'err') {
            msgBox.textContent = text || '';
            msgBox.className = type === 'err' ? 'login-error' : 'login-ok';
            msgBox.hidden = !text;
        }
        function setLoading(on) {
            btn.disabled = on;
            btn.className = 'btn btn-primary';
            btn.innerHTML = on
                ? '<i class="fas fa-circle-notch fa-spin"></i> Memproses…'
                : '<i class="fas fa-right-to-bracket"></i> Masuk';
        }
        function errMsg(e) {
            const map = {
                'auth/invalid-email': 'Format email tidak valid.',
                'auth/user-not-found': 'Akun tidak ditemukan.',
                'auth/wrong-password': 'Password salah.',
                'auth/invalid-credential': 'Email atau password salah.',
                'auth/user-disabled': 'Akun admin dinonaktifkan.',
                'auth/too-many-requests': 'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.',
                'auth/network-request-failed': 'Gagal terhubung ke internet.',
                'auth/operation-not-allowed': 'Login Email/Password belum diaktifkan di Firebase Console.'
            };
            return map[e.code] || ('Login gagal: ' + (e.message || e));
        }

        /* ---- Tampilkan / sembunyikan password ---- */
        $('pwToggle').addEventListener('click', () => {
            passEl.type = passEl.type === 'password' ? 'text' : 'password';
            $('pwToggle').innerHTML = passEl.type === 'password'
                ? '<i class="far fa-eye"></i>' : '<i class="far fa-eye-slash"></i>';
            passEl.focus();
        });

        /* ---- Proses login ---- */
        $('loginForm').addEventListener('submit', async e => {
            e.preventDefault();
            showMsg('');

            const email = emailEl.value.trim(), password = passEl.value;
            if (!email || !password) return showMsg('Email dan password wajib diisi.');

            setLoading(true);
            try {
                await auth.setPersistence(
                    REMEMBER ? firebase.auth.Auth.Persistence.LOCAL
                             : firebase.auth.Auth.Persistence.SESSION
                );
                const cred = await auth.signInWithEmailAndPassword(email, password);

                // pastikan yang login adalah admin yang diizinkan
                const uEmail = (cred.user.email || '').toLowerCase();
                if (!ALLOWED_ADMIN_EMAILS.includes(uEmail)) {
                    await auth.signOut();
                    setLoading(false);
                    return showMsg('Akun ini tidak memiliki akses admin.');
                }

                setLoading(false);
                btn.className = 'btn btn-green';
                btn.innerHTML = '<i class="fas fa-check"></i> Berhasil! Mengalihkan…';
                showMsg('Login berhasil, mengalihkan ke tujuan…', 'ok');
                setTimeout(() => location.href = REDIRECT_URL, 800);
            } catch (err) {
                setLoading(false);
                showMsg(errMsg(err));
            }
        });

        /* ---- Lupa password ---- */
        $('forgotLink').addEventListener('click', e => {
            e.preventDefault();
            const email = prompt('Masukkan email admin untuk menerima link reset password:');
            if (!email) return;
            auth.sendPasswordResetEmail(email.trim())
                .then(() => showMsg('Email reset terkirim. Cek folder inbox/spam Anda.', 'ok'))
                .catch(err => showMsg(errMsg(err)));
        });

        /* ---- Logout paksa via URL ?logout ---- */
        if (new URLSearchParams(location.search).has('logout')) auth.signOut();

        /* ---- Auto-redirect jika sesi masih aktif ---- */
        auth.onAuthStateChanged(user => {
            if (AUTO_REDIRECT && user && ALLOWED_ADMIN_EMAILS.includes((user.email || '').toLowerCase())) {
                location.replace(REDIRECT_URL);
            }
        });
    </script>
</body>
</html>
